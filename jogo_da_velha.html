<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - UNIFOR</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        header {
            text-align: center;
            margin-bottom: 22px;
        }

        .subtitle {
            color: #0056b3;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        h1 {
            color: #003366;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls select {
            padding: 8px 14px;
            border: 2px solid #003366;
            border-radius: 6px;
            background: #fff;
            color: #003366;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .controls select:focus { border-color: #0056b3; }

        .scoreboard {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 450px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 16px 28px;
            margin-bottom: 18px;
            justify-content: space-between;
        }

        .player-info { text-align: center; min-width: 90px; }

        .player-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .player-label.x-color { color: #003366; }
        .player-label.o-color { color: #d97706; }

        .score {
            font-size: 42px;
            font-weight: 900;
            line-height: 1;
        }

        .score.x-color { color: #003366; }
        .score.o-color { color: #d97706; }

        .round-info { text-align: center; }

        .round-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 4px;
        }

        #round-display {
            font-size: 22px;
            font-weight: 700;
            color: #003366;
        }

        #status {
            font-size: 18px;
            font-weight: 600;
            color: #003366;
            margin-bottom: 20px;
            text-align: center;
            min-height: 27px;
        }

        .board-wrapper {
            position: relative;
            margin-bottom: 26px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 8px;
            background: #003366;
            padding: 8px;
            border-radius: 12px;
        }

        .cell {
            width: 110px;
            height: 110px;
            background: #fff;
            border: none;
            border-radius: 8px;
            font-size: 54px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.15s;
        }

        .cell:hover:not(:disabled) { background: #e8f0fe; }
        .cell:disabled { cursor: default; }
        .cell.x { color: #003366; }
        .cell.o { color: #d97706; }

        #win-line {
            position: absolute;
            height: 8px;
            background: #d97706;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            transform-origin: left center;
            z-index: 10;
        }

        #restart-btn {
            padding: 14px 36px;
            background: #003366;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        #restart-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
    <p class="subtitle">Universidade de Fortaleza</p>
    <h1>Jogo da Velha</h1>
</header>

<div class="controls">
    <select id="mode-select">
        <option value="pvp">2 Jogadores (PVP)</option>
        <option value="cpu">Contra o Computador</option>
    </select>
    <select id="format-select">
        <option value="single">Partida Única</option>
        <option value="bo3">Melhor de 3 (MD3)</option>
    </select>
</div>

<div class="scoreboard">
    <div class="player-info">
        <div class="player-label x-color" id="label-x">Jogador X</div>
        <div class="score x-color" id="score-x">0</div>
    </div>
    <div class="round-info">
        <div class="round-label">Rodada</div>
        <div id="round-display">1/1</div>
    </div>
    <div class="player-info">
        <div class="player-label o-color" id="label-o">Jogador O</div>
        <div class="score o-color" id="score-o">0</div>
    </div>
</div>

<div id="status">Vez do Jogador X</div>

<div class="board-wrapper">
    <div id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>
    <div id="win-line"></div>
</div>

<button id="restart-btn">Reiniciar Jogo</button>

<script>
    // ── State (Seção 18 – Dicionário de Dados) ────────────────────────────────
    let options       = ['','','','','','','','',''];
    let currentPlayer = 'X';
    let running       = false;
    let winsX         = 0;
    let winsO         = 0;
    let currentRound  = 1;
    let modeSelect    = 'pvp';
    let formatSelect  = 'single';

    const winPatterns = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    // ── DOM ───────────────────────────────────────────────────────────────────
    const cells          = document.querySelectorAll('.cell');
    const statusEl       = document.getElementById('status');
    const scoreXEl       = document.getElementById('score-x');
    const scoreOEl       = document.getElementById('score-o');
    const labelOEl       = document.getElementById('label-o');
    const roundDisplayEl = document.getElementById('round-display');
    const winLineEl      = document.getElementById('win-line');
    const boardWrapEl    = document.querySelector('.board-wrapper');
    const restartBtn     = document.getElementById('restart-btn');
    const modeSelectEl   = document.getElementById('mode-select');
    const formatSelectEl = document.getElementById('format-select');
    const confettiCanvas = document.getElementById('confetti-canvas');

    // ── Áudio – Web Audio API (RF-04 / RNF Zero Dependência) ─────────────────
    let audioCtx = null;

    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playSound(type) {
        const ctx = getAudioCtx();

        if (type === 'X') {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start(); osc.stop(ctx.currentTime + 0.25);

        } else if (type === 'O') {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start(); osc.stop(ctx.currentTime + 0.25);

        } else if (type === 'win') {
            // Acorde sintetizado de vitória: C5 – E5 – G5
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                const osc = ctx.createOscillator(), g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.type = 'sine';
                const t = ctx.currentTime + i * 0.06;
                osc.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0.2, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
                osc.start(t); osc.stop(t + 0.8);
            });

        } else if (type === 'draw') {
            // Som descendente sintetizado de empate
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(220, ctx.currentTime + 0.7);
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
            osc.start(); osc.stop(ctx.currentTime + 0.7);
        }
    }

    // ── Confetes (RF-06) ──────────────────────────────────────────────────────
    let confettiParticles = [];
    let confettiRafId     = null;

    function launchConfetti() {
        confettiCanvas.width  = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        if (confettiRafId) cancelAnimationFrame(confettiRafId);
        confettiParticles = [];
        const colors = ['#003366','#0056b3','#d97706','#f59e0b','#10b981','#ef4444','#ffffff'];
        for (let i = 0; i < 160; i++) {
            confettiParticles.push({
                x:     Math.random() * confettiCanvas.width,
                y:     -10 - Math.random() * 80,
                w:     Math.random() * 10 + 6,
                h:     Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx:    (Math.random() - 0.5) * 5,
                vy:    Math.random() * 3 + 2,
                angle: Math.random() * 360,
                va:    (Math.random() - 0.5) * 8
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        const ctx2d = confettiCanvas.getContext('2d');
        ctx2d.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiParticles = confettiParticles.filter(p => p.y < confettiCanvas.height + 20);
        confettiParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.angle += p.va;
            ctx2d.save();
            ctx2d.translate(p.x, p.y);
            ctx2d.rotate(p.angle * Math.PI / 180);
            ctx2d.fillStyle = p.color;
            ctx2d.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx2d.restore();
        });
        if (confettiParticles.length > 0) {
            confettiRafId = requestAnimationFrame(animateConfetti);
        } else {
            ctx2d.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
    }

    // ── Linha de vitória (RF-06 / UI-10) ──────────────────────────────────────
    function showWinLine(pattern) {
        const wr   = boardWrapEl.getBoundingClientRect();
        const r1   = cells[pattern[0]].getBoundingClientRect();
        const r2   = cells[pattern[2]].getBoundingClientRect();
        const x1   = r1.left + r1.width  / 2 - wr.left;
        const y1   = r1.top  + r1.height / 2 - wr.top;
        const x2   = r2.left + r2.width  / 2 - wr.left;
        const y2   = r2.top  + r2.height / 2 - wr.top;
        const len  = Math.hypot(x2 - x1, y2 - y1);
        const ang  = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);
        winLineEl.style.left      = x1 + 'px';
        winLineEl.style.top       = (y1 - 4) + 'px';
        winLineEl.style.width     = len + 'px';
        winLineEl.style.transform = `rotate(${ang}deg)`;
        winLineEl.style.opacity   = '1';
    }

    function hideWinLine() { winLineEl.style.opacity = '0'; }

    // ── Helpers de UI ─────────────────────────────────────────────────────────
    function updateStatus() {
        if (modeSelect === 'cpu' && currentPlayer === 'O') {
            statusEl.textContent = 'Vez do Computador';
        } else {
            statusEl.textContent = `Vez do Jogador ${currentPlayer}`;
        }
    }

    function updateRoundDisplay() {
        roundDisplayEl.textContent = formatSelect === 'single' ? '1/1' : `${currentRound}/3`;
    }

    function updateScoreboard() {
        scoreXEl.textContent = winsX;
        scoreOEl.textContent = winsO;
    }

    function updateLabels() {
        labelOEl.textContent = modeSelect === 'cpu' ? 'Computador' : 'Jogador O';
    }

    function disableBoard() {
        running = false;
        cells.forEach(c => { c.disabled = true; });
    }

    function clearBoard() {
        options = ['','','','','','','','',''];
        cells.forEach(c => {
            c.textContent = '';
            c.className   = 'cell';
            c.disabled    = false;
        });
        hideWinLine();
    }

    // ── Lógica do jogo ────────────────────────────────────────────────────────
    function handleCellClick(index) {
        if (!running)             return;   // CA-03
        if (options[index] !== '') return;  // CA-02

        // P4.1
        options[index]        = currentPlayer;
        cells[index].textContent = currentPlayer;
        cells[index].classList.add(currentPlayer.toLowerCase());
        cells[index].disabled = true;

        playSound(currentPlayer); // P4.2
        checkResult();            // P4.3
    }

    function checkResult() {
        // Verificar vitória (A1)
        for (const pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (options[a] && options[a] === options[b] && options[a] === options[c]) {
                handleWin(pattern);
                return;
            }
        }

        // Verificar empate (E1)
        if (!options.includes('')) {
            handleDraw();
            return;
        }

        // P5 – alterna turno
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus(); // P6

        // A2 – jogada do computador
        if (modeSelect === 'cpu' && currentPlayer === 'O') {
            running = false; // A2.2 – bloqueia cliques
            cpuMove();
        }
    }

    function handleWin(pattern) {
        disableBoard();         // CA-03
        showWinLine(pattern);   // A1.2
        launchConfetti();       // A1.3
        playSound('win');       // A1.4

        // A1.5
        if (currentPlayer === 'X') winsX++; else winsO++;
        updateScoreboard();

        // A1.6
        const nome = currentPlayer === 'X'
            ? 'Jogador X'
            : (modeSelect === 'cpu' ? 'Computador' : 'Jogador O');
        statusEl.textContent = `${nome} venceu a rodada!`;

        // A1.7 – Melhor de 3
        if (formatSelect === 'bo3') {
            if (winsX >= 2 || winsO >= 2) {
                // A1.7.1 – campeão definitivo
                const campeao = winsX >= 2
                    ? 'Jogador X'
                    : (modeSelect === 'cpu' ? 'Computador' : 'Jogador O');
                statusEl.textContent = `${campeao} é o campeão da partida!`;
            } else if (currentRound < 3) {
                // A1.7.2 – próxima rodada
                currentRound++;
                setTimeout(() => {
                    clearBoard();
                    currentPlayer = 'X';
                    running = true;
                    updateStatus();
                    updateRoundDisplay();
                }, 2000);
            }
            // round = 3 e sem campeão: jogo encerra (board desabilitado)
        }
        // A1.8 – Partida Única: encerrado até reinício manual
    }

    function handleDraw() {
        disableBoard();                              // CA-03
        playSound('draw');                           // E1.2
        statusEl.textContent = 'Rodada Empatada!';  // E1.3

        // E1.4
        if (formatSelect === 'bo3' && currentRound < 3) {
            setTimeout(() => {
                clearBoard();
                currentPlayer = 'X';
                running = true;
                updateStatus();
                updateRoundDisplay();
                // currentRound NÃO incrementa em empate
            }, 2000);
        }
    }

    function cpuMove() {
        setTimeout(() => {                               // A2.3 – 400ms
            const vazias = options.reduce((acc, v, i) => (v === '' ? [...acc, i] : acc), []);
            if (!vazias.length) return;
            const escolha = vazias[Math.floor(Math.random() * vazias.length)]; // A2.4

            // A2.5 – executa movimento (equivale a P4.1)
            options[escolha]          = 'O';
            cells[escolha].textContent = 'O';
            cells[escolha].classList.add('o');
            cells[escolha].disabled   = true;

            playSound('O'); // P4.2
            running = true;
            checkResult();  // P4.3
        }, 400);
    }

    // ── Reinício completo (A3) ────────────────────────────────────────────────
    function fullRestart() {
        winsX = 0; winsO = 0; currentRound = 1; // A3.2
        clearBoard();                             // A3.3
        currentPlayer = 'X';                     // A3.4
        running = true;
        updateScoreboard();
        updateLabels();
        updateStatus();      // P2
        updateRoundDisplay();
    }

    // ── Eventos ───────────────────────────────────────────────────────────────
    cells.forEach(cell =>
        cell.addEventListener('click', () =>
            handleCellClick(parseInt(cell.dataset.index))
        )
    );

    restartBtn.addEventListener('click', fullRestart); // A3.1

    modeSelectEl.addEventListener('change', () => {    // A3.1
        modeSelect = modeSelectEl.value;
        fullRestart();
    });

    formatSelectEl.addEventListener('change', () => {  // A3.1
        formatSelect = formatSelectEl.value;
        fullRestart();
    });

    // ── Inicialização ─────────────────────────────────────────────────────────
    fullRestart();
</script>
</body>
</html>
